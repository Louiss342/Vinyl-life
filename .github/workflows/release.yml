name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 与 CI 相同的构建顺序：build 生成 src/core/gateway-bundle.ts 并打进 main.js
      - name: Build
        run: npm run build

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Obsidian 官方要求：Release 附件为 main.js / manifest.json / styles.css
      # （manifest.json 直接取工作区版本，保证与 tag 一致）
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
