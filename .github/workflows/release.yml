name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 与 CI 相同的构建顺序：build 生成 src/core/gateway-bundle.ts / style-bundle.ts 并打进 main.js
      - name: Build
        run: npm run build

      # 与 CI 同一套门槛：tag 指向的提交必须是绿的，否则不发（CI 只在分支推送时跑，tag 不会触发它）
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # 发布前最后一道：tag 必须与 manifest.json 的 version 一致。
      # 此前这条链路没有任何比对 —— 推个 1.0.6 的 tag 但 manifest 还是 1.0.5 也照发，
      # 用户那边只会看到「已经装过」，更新永远不出现。
      - name: Check tag matches manifest version
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag '$tag' 与 manifest.json 的 version '$version' 不一致 —— 先改 manifest.version 再跑 npm run version-bump，然后提交并推同名 tag"
            exit 1
          fi
          echo "tag $tag == manifest.version $version"

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Obsidian 官方要求：Release 附件为 main.js / manifest.json / styles.css
      # （manifest.json 直接取工作区版本，保证与 tag 一致）
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
